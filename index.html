<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olympian Voice</title>
<style>
html,body{margin:0;height:100%;background:#07040d;overflow:hidden;font-family:system-ui,sans-serif;color:#e8f9ff;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#tri{position:fixed;top:0;right:0;width:68px;height:68px;background:#00e5ff;clip-path:polygon(0 0,100% 0,100% 100%);border:0;padding:0;z-index:5}
#menu{position:fixed;top:60px;right:8px;width:272px;max-height:76vh;overflow-y:auto;background:rgba(8,18,28,.9);border:1px solid #00e5ff88;border-radius:14px;padding:10px 14px 14px;display:none;z-index:4;font-size:.85rem}
#menu h3{margin:12px 0 2px;font-size:.7rem;letter-spacing:.12em;color:#00e5ff;text-transform:uppercase}
#menu label{display:flex;justify-content:space-between;margin-top:8px}
#menu input[type=range]{width:100%;accent-color:#00e5ff}
button.b{background:transparent;color:#e8f9ff;border:1px solid #00e5ff88;border-radius:8px;padding:6px 10px;margin:4px 4px 0 0;font:inherit}
.tk{display:flex;align-items:center;gap:6px;margin-top:6px}.tk span{flex:1;font-size:.75rem}
#rec{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:3px solid #ff4d6d;background:transparent;display:none;z-index:3;padding:0}
#rec i{display:block;width:34px;height:34px;margin:auto;border-radius:50%;background:#ff4d6d;transition:.2s}
#rec.on i{border-radius:6px;width:22px;height:22px;animation:p 1s infinite}
@keyframes p{50%{opacity:.4}}
#t{position:fixed;bottom:100px;width:100%;text-align:center;font-size:.9rem;color:#ff8fa3;z-index:3}
#msg{position:fixed;top:16px;left:16px;font-size:.8rem;color:#9fdcea;max-width:60%}
</style></head><body>
<canvas id="cv"></canvas>
<div id="msg"></div>
<button id="tri" aria-label="Menu"></button>
<div id="menu"><h3>Presets</h3><div id="pre"></div><h3>Voice</h3><div id="sl"></div>
<h3>Backing track</h3><input type="file" id="file" accept="audio/*" style="width:100%;margin-top:6px"><button class="b" id="bp">Play / pause</button>
<h3>Takes</h3><div id="takes"></div></div>
<div id="t"></div><button id="rec" aria-label="Record"><i></i></button>
<script>
const $=i=>document.getElementById(i);
const D=[['pitch','Pitch drop (st)',-12,0,.5],['sub','Deep sub layer',0,1,.01],['body','Body & fullness',0,1,.01],['mech','Mechanical',0,1,.01],['rf','Mechanical Hz',25,220,1],['echo','Echo mix',0,1,.01],['et','Echo time',.1,.8,.01],['fb','Echo repeats',0,.85,.01],['rev','Reverb',0,1,.01],['wid','Panoramic width',0,1,.01],['hv','Harmony voice',0,1,.01],['hi','Harmony interval (st)',1,12,1],['bk','Backing volume',0,1,.01],['vol','Output volume',0,1.5,.01]];
const P={
'Olympian goddess':{pitch:-7,sub:.45,body:.75,mech:.3,rf:55,echo:.4,et:.38,fb:.5,rev:.6,wid:.8,hv:.25,hi:4,bk:.7,vol:.9},
'Robot oracle':{pitch:-4,sub:.25,body:.5,mech:.8,rf:90,echo:.3,et:.22,fb:.4,rev:.3,wid:.5,hv:0,hi:7,bk:.7,vol:.9},
'Cathedral choir':{pitch:-5,sub:.35,body:.7,mech:.1,rf:40,echo:.5,et:.5,fb:.6,rev:.9,wid:1,hv:.5,hi:7,bk:.7,vol:.85}};
let S={...P['Olympian goddess']},A=null,rec=false,CL=[],CR=[],takes=[];

D.forEach(([k,n,mn,mx,st])=>{const l=document.createElement('label');l.innerHTML=`<span>${n}</span><output id="o_${k}"></output>`;const r=document.createElement('input');r.type='range';r.id=k;r.min=mn;r.max=mx;r.step=st;r.oninput=()=>{S[k]=+r.value;sync()};$('sl').append(l,r)});
Object.keys(P).forEach(n=>{const b=document.createElement('button');b.className='b';b.textContent=n;b.onclick=()=>{S={...P[n]};sync()};$('pre').append(b)});
$('tri').onclick=()=>{const m=$('menu');m.style.display=m.style.display=='block'?'none':'block'};
function sync(){D.forEach(([k])=>{$(k).value=S[k];$('o_'+k).textContent=(+S[k]).toFixed(2)});apply()}

function shifter(ctx,rf){const N=16384,M=N-1,W=2048,buf=new Float32Array(N);let w=0,ph=0;const sp=ctx.createScriptProcessor(1024,1,1);
sp.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0),y=e.outputBuffer.getChannelData(0),r=rf();
for(let i=0;i<x.length;i++){buf[w]=x[i];w=(w+1)&M;ph+=(1-r)/W;ph-=Math.floor(ph);let o=0;
for(let k=0;k<2;k++){const p=(ph+k*.5)%1,rp=(w-(p*W+2)+N)%N,i0=Math.floor(rp),f=rp-i0,s=buf[i0&M]*(1-f)+buf[(i0+1)&M]*f,g=Math.sin(Math.PI*p);o+=s*g*g}y[i]=o}};return sp}
function impulse(ctx,sec){const n=ctx.sampleRate*sec|0,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const t=i/n;lp+=((Math.random()*2-1)-lp)*(.25+.5*(1-t));d[i]=lp*Math.pow(1-t,2.6)*1.8}}return b}

const au=new Audio();au.loop=true;
$('file').onchange=e=>{const f=e.target.files[0];if(f){au.src=URL.createObjectURL(f);msg('Backing loaded')}};
$('bp').onclick=()=>{if(!A)return msg('Tap the mic first');au.paused?au.play():au.pause()};
function msg(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent==t)$('msg').textContent=''},3000)}

async function start(){
const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
const src=ctx.createMediaStreamSource(stream),hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=70;src.connect(hp);
const st=()=>S.pitch/12,main=shifter(ctx,()=>Math.pow(2,st())),sub=shifter(ctx,()=>Math.pow(2,st())*.5),har=shifter(ctx,()=>Math.pow(2,(S.pitch+S.hi)/12));
const subG=ctx.createGain(),harG=ctx.createGain(),bus=ctx.createGain();
hp.connect(main);hp.connect(sub);hp.connect(har);main.connect(bus);sub.connect(subG);subG.connect(bus);har.connect(harG);harG.connect(bus);
const tone=ctx.createGain(),clean=ctx.createGain(),ring=ctx.createGain(),ringW=ctx.createGain();ring.gain.value=0;
const osc=ctx.createOscillator();osc.start();osc.connect(ring.gain);
const rd=ctx.createDelay(.1),rfb=ctx.createGain(),rdW=ctx.createGain();rd.delayTime.value=.006;rfb.gain.value=.6;
bus.connect(clean);clean.connect(tone);bus.connect(ring);ring.connect(ringW);ringW.connect(tone);bus.connect(rd);rd.connect(rfb);rfb.connect(rd);rd.connect(rdW);rdW.connect(tone);
const ls=ctx.createBiquadFilter();ls.type='lowshelf';ls.frequency.value=220;
const pk=ctx.createBiquadFilter();pk.type='peaking';pk.frequency.value=140;pk.Q.value=.8;
const hs=ctx.createBiquadFilter();hs.type='highshelf';hs.frequency.value=5500;hs.gain.value=3;
const comp=ctx.createDynamicsCompressor();comp.threshold.value=-24;comp.ratio.value=4;
tone.connect(ls);ls.connect(pk);pk.connect(hs);hs.connect(comp);
const master=ctx.createGain(),out=ctx.createGain();out.channelCount=2;out.channelCountMode='explicit';comp.connect(master);
const wL=ctx.createDelay(.1),wR=ctx.createDelay(.1),wG=ctx.createGain(),mg=ctx.createChannelMerger(2);wL.delayTime.value=.017;wR.delayTime.value=.029;
const l1=ctx.createOscillator(),l2=ctx.createOscillator(),d1=ctx.createGain(),d2=ctx.createGain();l1.frequency.value=.31;l2.frequency.value=.23;d1.gain.value=.003;d2.gain.value=.004;
l1.connect(d1);d1.connect(wL.delayTime);l2.connect(d2);d2.connect(wR.delayTime);l1.start();l2.start();
comp.connect(wL);comp.connect(wR);wL.connect(mg,0,0);wR.connect(mg,0,1);mg.connect(wG);wG.connect(master);
const eG=ctx.createGain(),dL=ctx.createDelay(1.5),dR=ctx.createDelay(1.5),f1=ctx.createGain(),f2=ctx.createGain(),em=ctx.createChannelMerger(2),eLP=ctx.createBiquadFilter();eLP.type='lowpass';eLP.frequency.value=3500;
comp.connect(eLP);eLP.connect(dL);dL.connect(f1);f1.connect(dR);dR.connect(f2);f2.connect(dL);dL.connect(em,0,0);dR.connect(em,0,1);em.connect(eG);eG.connect(master);
const conv=ctx.createConvolver();conv.buffer=impulse(ctx,4);const rG=ctx.createGain();comp.connect(conv);conv.connect(rG);rG.connect(master);
const bkS=ctx.createMediaElementSource(au),bkG=ctx.createGain();bkS.connect(bkG);bkG.connect(out);
master.connect(out);out.connect(ctx.destination);
const an=ctx.createAnalyser();an.fftSize=512;out.connect(an);
const rc=ctx.createScriptProcessor(4096,2,2);out.connect(rc);rc.connect(ctx.destination);
rc.onaudioprocess=e=>{if(rec){CL.push(new Float32Array(e.inputBuffer.getChannelData(0)));CR.push(new Float32Array(e.inputBuffer.getChannelData(1)))}};
A={ctx,stream,an,td:new Uint8Array(512),subG,harG,clean,ringW,rdW,osc,ls,pk,eG,dL,dR,f1,f2,rG,wG,out,bkG};apply()}

function apply(){if(!A)return;const t=A.ctx.currentTime,s=(p,v)=>p.setTargetAtTime(v,t,.05);
s(A.subG.gain,S.sub*.9);s(A.harG.gain,S.hv);s(A.clean.gain,1-S.mech*.8);s(A.ringW.gain,S.mech*1.4);s(A.rdW.gain,S.mech*.5);s(A.osc.frequency,S.rf);
s(A.ls.gain,S.body*10);s(A.pk.gain,S.body*5);s(A.eG.gain,S.echo);s(A.dL.delayTime,S.et);s(A.dR.delayTime,S.et*1.37);s(A.f1.gain,S.fb);s(A.f2.gain,S.fb);
s(A.rG.gain,S.rev*1.6);s(A.wG.gain,S.wid*1.1);s(A.bkG.gain,S.bk);s(A.out.gain,S.vol)}

function wav(L,R,sr){const n=L.reduce((a,c)=>a+c.length,0),b=new DataView(new ArrayBuffer(44+n*4)),s=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
s(0,'RIFF');b.setUint32(4,36+n*4,true);s(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,2,true);b.setUint32(24,sr,true);b.setUint32(28,sr*4,true);b.setUint16(32,4,true);b.setUint16(34,16,true);s(36,'data');b.setUint32(40,n*4,true);
let o=44;for(let k=0;k<L.length;k++)for(let i=0;i<L[k].length;i++)for(const c of [L,R]){const v=Math.max(-1,Math.min(1,c[k][i]));b.setInt16(o,v<0?v*32768:v*32767,true);o+=2}
return new Blob([b],{type:'audio/wav'})}
function save(b,n){if(window.Android){const r=new FileReader();r.onload=()=>Android.saveFile(r.result.split(',')[1],n,'audio/wav');r.readAsDataURL(b)}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}}
function bt(t,f){const b=document.createElement('button');b.className='b';b.textContent=t;b.onclick=f;return b}
function takesUI(){$('takes').innerHTML='';takes.forEach(k=>{const d=document.createElement('div');d.className='tk';d.innerHTML=`<span>${k.name}</span>`;d.append(bt('Play',()=>new Audio(k.url).play()),bt('Export',()=>save(k.blob,k.name)));$('takes').append(d)})}
let t0=0;
function toggleRec(){if(!A)return;
if(!rec){CL=[];CR=[];rec=true;t0=Date.now();$('rec').classList.add('on')}
else{rec=false;$('rec').classList.remove('on');$('t').textContent='';if(CL.length){const b=wav(CL,CR,A.ctx.sampleRate),n=`olympian-take-${takes.length+1}.wav`;takes.push({blob:b,name:n,url:URL.createObjectURL(b)});takesUI();msg('Saved take — open menu to export')}}}
$('rec').onclick=toggleRec;
async function toggle(){
if(A){if(rec)toggleRec();au.pause();A.stream.getTracks().forEach(t=>t.stop());A.ctx.close();A=null;$('rec').style.display='none';return}
try{await start();$('rec').style.display='block'}catch(e){msg('Mic unavailable: allow microphone access')}}
$('cv').onclick=toggle;

const cv=$('cv'),g=cv.getContext('2d');let W,H;
function rs(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}addEventListener('resize',rs);rs();
let lv=0,hue=190,rings=[],last=0;
function frame(t){requestAnimationFrame(frame);let tg=0;
if(A){A.an.getByteTimeDomainData(A.td);let m=0;for(const v of A.td)m=Math.max(m,Math.abs(v-128));tg=Math.min(1,m/128*2.2)}else tg=.04+.03*Math.sin(t/700);
lv+=(tg-lv)*(tg>lv?.5:.08);hue=(hue+.4+lv*4)%360;
if(A&&lv>.12&&t-last>180){rings.push({r:0,a:.7});last=t}
if(rec)$('t').textContent='● '+((Date.now()-t0)/1000).toFixed(1)+'s';
const u=Math.min(W,H)/700,cx=W/2,cy=H*.44,col=A?`hsl(${hue},100%,${58+lv*12}%)`:'hsl(190,45%,40%)';
g.fillStyle='#07040d';g.fillRect(0,0,W,H);
const R=260*u*(1+lv*.6),gr=g.createRadialGradient(cx,cy,0,cx,cy,R*1.7);gr.addColorStop(0,`hsla(${hue},100%,55%,${.12+lv*.45})`);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(0,0,W,H);
rings=rings.filter(r=>r.a>.02);for(const r of rings){r.r+=(5+lv*10)*u;r.a*=.972;g.strokeStyle=`hsla(${hue+r.r/4},100%,60%,${r.a})`;g.lineWidth=4*u;g.beginPath();g.arc(cx,cy,140*u+r.r,0,7);g.stroke()}
g.save();g.translate(cx,cy);const sc=1+lv*.14;g.scale(sc,sc);
g.shadowColor=col;g.shadowBlur=(30+lv*90)*u;g.strokeStyle=col;g.lineWidth=7*u;g.lineCap='round';
const w=72*u,h=112*u,y0=-h-30*u;
g.beginPath();g.roundRect(-w,y0,2*w,2*h,w);g.fillStyle='rgba(255,255,255,.05)';g.fill();g.stroke();
g.save();g.clip();g.shadowBlur=0;g.lineWidth=2.5*u;for(let i=-5;i<=5;i++){g.beginPath();g.moveTo(-w,-30*u+i*20*u);g.lineTo(w,-30*u+i*20*u);g.moveTo(i*14*u,y0);g.lineTo(i*14*u,y0+2*h);g.stroke()}g.restore();
g.beginPath();g.arc(0,0,w+26*u,0,Math.PI);g.moveTo(0,w+26*u);g.lineTo(0,w+130*u);g.moveTo(-70*u,w+130*u);g.lineTo(70*u,w+130*u);g.stroke();
g.restore();
if(!A){g.fillStyle='#9fdcea';g.font=`${22*u}px system-ui`;g.textAlign='center';g.fillText('tap the mic',cx,cy+330*u)}}
sync();requestAnimationFrame(frame);
</script></body></html>
