<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olympian Voice</title>
<style>
html,body{margin:0;height:100%;background:#07040d;overflow:hidden;font-family:system-ui,sans-serif;color:#e8f9ff;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#tri{position:fixed;top:0;right:0;width:68px;height:68px;background:#00e5ff;clip-path:polygon(0 0,100% 0,100% 100%);border:0;padding:0;z-index:5}
#menu{position:fixed;top:60px;right:8px;width:272px;max-height:76vh;overflow-y:auto;background:rgba(8,18,28,.9);border:1px solid #00e5ff88;border-radius:14px;padding:10px 14px 14px;display:none;z-index:4;font-size:.85rem}
#menu h3{margin:12px 0 2px;font-size:.7rem;letter-spacing:.12em;color:#00e5ff;text-transform:uppercase}
#menu label{display:flex;justify-content:space-between;margin-top:8px}
#menu input[type=range]{width:100%;accent-color:#00e5ff}
button.b{background:transparent;color:#e8f9ff;border:1px solid #00e5ff88;border-radius:8px;padding:6px 10px;margin:4px 4px 0 0;font:inherit}
.tk{display:flex;align-items:center;gap:6px;margin-top:6px}.tk span{flex:1;font-size:.75rem}
#rec{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:3px solid #ff4d6d;background:transparent;display:none;z-index:3;padding:0}
#rec i{display:block;width:34px;height:34px;margin:auto;border-radius:50%;background:#ff4d6d;transition:.2s}
#rec.on i{border-radius:6px;width:22px;height:22px;animation:p 1s infinite}
@keyframes p{50%{opacity:.4}}
#t{position:fixed;bottom:100px;width:100%;text-align:center;font-size:.9rem;color:#ff8fa3;z-index:3}
#msg{position:fixed;top:16px;left:16px;font-size:.8rem;color:#9fdcea;max-width:60%}

#tri{width:48px;height:48px;clip-path:none;border:1px solid #00e5ff77;border-radius:50%;background:rgba(7,20,32,.88);color:#9ff7ff;font-size:20px;top:calc(14px + env(safe-area-inset-top,0px));right:14px}

#msg{top:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;max-width:100%;width:100%;text-align:center;pointer-events:none}
#t{bottom:calc(66px + env(safe-area-inset-bottom,0px));font-size:.75rem}
#menu{top:calc(68px + env(safe-area-inset-top,0px));right:12px;max-height:78vh;width:min(290px,calc(100vw - 52px));z-index:10;background:rgba(8,18,28,.98)}
#tri{z-index:11}
#rec{display:none!important}
.tk video{width:100%;max-height:130px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="msg"></div>
<button id="tri" aria-label="Menu">☰</button>

<div id="menu"><h3>Mode</h3><div id="modebar" style="display:flex;gap:6px"><button class="b" id="voiceMode">Voice studio</button><button class="b" id="ambientMode">Ambient lab</button></div><h3>Presets</h3><div id="pre"></div><h3>Microphone input</h3><select id="device" style="width:100%;margin-top:6px;background:#101d2b;color:#e8f9ff;border:1px solid #00e5ff88;border-radius:7px;padding:7px"><option value="">System default microphone</option></select><h3>Headphone / speaker output</h3>
<select id="outputDevice" style="width:100%;margin-top:6px;background:#101d2b;color:#e8f9ff;border:1px solid #00e5ff88;border-radius:7px;padding:7px"><option value="">System default output</option></select>
<div class="audio-controls">
<button class="b" id="micToggle">Microphone: OFF</button>
<button class="b" id="monitorToggle">Live monitor: ON</button>
<button class="b" id="recordToggle">Record voice + music</button>
</div>
<p id="audioStatus" class="audio-status">Mic off · monitoring and recording are stopped</p>
<h3>Input sensitivity</h3><input id="inputGain" type="range" min="0.1" max="2" step="0.05" value="1.2"><h3>Headphone monitor level</h3><input id="monitorGain" type="range" min="0" max="0.55" step="0.01" value="0.18"><h3>Voice</h3><div id="sl"></div>
<h3>Backing track — included in recordings</h3><input type="file" id="file" accept="audio/*" style="width:100%;margin-top:6px"><button class="b" id="bp">Play / pause</button>
<h3>Takes</h3><div id="takes"></div></div>
<div id="t"></div>
<script>
const $=i=>document.getElementById(i);
const D=[['pitch','Pitch drop (st)',-12,0,.5],['sub','Deep sub layer',0,1,.01],['body','Body & fullness',0,1,.01],['mech','Mechanical',0,1,.01],['rf','Mechanical Hz',25,220,1],['echo','Echo mix',0,1,.01],['et','Echo time',.1,.8,.01],['fb','Echo repeats',0,.85,.01],['rev','Reverb',0,1,.01],['wid','Panoramic width',0,1,.01],['hv','Harmony voice',0,1,.01],['hi','Harmony interval (st)',1,12,1],['bk','Backing volume',0,1,.01]];
const P={
'Skeleton':{pitch:-9,sub:.30,body:.68,mech:.30,rf:68,echo:.12,et:.28,fb:.18,rev:.26,wid:.48,hv:.06,hi:7,bk:.68,vol:.14},
'Robot':{pitch:-4,sub:.12,body:.4,mech:.55,rf:90,echo:.18,et:.22,fb:.22,rev:.2,wid:.35,hv:0,hi:7,bk:.68,vol:.18},
'Cathedral':{pitch:-5,sub:.18,body:.5,mech:.08,rf:40,echo:.3,et:.5,fb:.35,rev:.5,wid:.65,hv:.3,hi:7,bk:.68,vol:.18}};
let S={...P['Skeleton']},A=null,rec=false,CL=[],CR=[],takes=[],mode='voice',db=null,recordMode='voice',trackAttached=false,trackState=null;

D.forEach(([k,n,mn,mx,st])=>{const l=document.createElement('label');l.innerHTML=`<span>${n}</span><output id="o_${k}"></output>`;const r=document.createElement('input');r.type='range';r.id=k;r.min=mn;r.max=mx;r.step=st;r.oninput=()=>{S[k]=+r.value;sync()};$('sl').append(l,r)});
Object.keys(P).forEach(n=>{const b=document.createElement('button');b.className='b';b.textContent=n;b.onclick=()=>{S={...P[n]};sync()};$('pre').append(b)});
$('tri').onclick=(e)=>{
  e.stopPropagation();
  const m=$('menu');
  const opening=m.style.display!=='block';
  m.style.display=opening?'block':'none';
  $('tri').setAttribute('aria-expanded',String(opening));
};
$('menu').onclick=e=>e.stopPropagation();
$('cv').style.pointerEvents='auto';
let micLabel='TAP TO START';
const micSurface=$('cv');
micSurface.setAttribute('role','button');
micSurface.setAttribute('aria-label','Microphone — tap to start or stop');
micSurface.setAttribute('tabindex','0');
micSurface.addEventListener('click',()=>toggle());
micSurface.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
$('voiceMode').onclick=()=>setMode('voice');
$('ambientMode').onclick=()=>setMode('ambient');
$('inputGain').oninput=()=>{if(A)A.inputG.gain.setTargetAtTime(+$('inputGain').value,A.ctx.currentTime,.04)};
$('monitorGain').oninput=()=>{if(A)A.monitorG.gain.setTargetAtTime(monitorEnabled?+$('monitorGain').value:0,A.ctx.currentTime,.04)};
$('micToggle').onclick=()=>toggle();
$('monitorToggle').onclick=()=>{
 monitorEnabled=!monitorEnabled;updateAudioButtons();
 if(A)A.monitorG.gain.setTargetAtTime(monitorEnabled?+$('monitorGain').value:0,A.ctx.currentTime,.025);
};
$('recordToggle').onclick=()=>toggleRec();
$('device').onchange=async()=>{
 if(!A)return;
 const wasRecording=rec;
 if(wasRecording)toggleRec();
 await stopMic();
 try{await startMic()}catch(e){handleMicError(e)}
};
$('outputDevice').onchange=()=>setOutputDevice($('outputDevice').value);
let monitorEnabled=true;
function updateAudioButtons(){
 $('micToggle').textContent=`Microphone: ${A?'ON':'OFF'}`;
 $('monitorToggle').textContent=`Live monitor: ${monitorEnabled?'ON':'OFF'}`;
 $('recordToggle').textContent=rec?'Stop recording':'Start recording';
 $('audioStatus').textContent=A
  ? `Mic on · ${monitorEnabled?'live monitor on':'live monitor muted'} · ${rec?'recording voice + backing':'not recording'}`
  : 'Mic off · monitoring and recording stopped';
}
function handleMicError(e){
 micLabel='MICROPHONE ERROR';
 let m='Microphone error';
 if(e.name==='NotAllowedError'||e.name==='SecurityError')m='Microphone permission denied — allow access in browser/site settings';
 else if(e.name==='NotFoundError')m='No microphone found';
 else if(e.name==='NotReadableError')m='Microphone is busy or unavailable';
 else if(e.name==='OverconstrainedError')m='Selected microphone unavailable; choose System default';
 else m=`Microphone error: ${e.name||e.message||'unknown'}`;
 msg(m);updateAudioButtons();
}
function setMode(m){mode=m;$('voiceMode').style.borderColor=m==='voice'?'#00e5ff':'#00e5ff55';$('ambientMode').style.borderColor=m==='ambient'?'#00e5ff':'#00e5ff55';if(A){const t=A.ctx.currentTime;A.ambientG.gain.setTargetAtTime(m==='ambient'?2.0:0,t,.04);A.voiceG.gain.setTargetAtTime(m==='voice'?1:0,t,.04);msg(m==='ambient'?'Ambient lab active — natural sound':'Voice studio active — effects enabled')}}
setMode('voice');
function sync(){D.forEach(([k])=>{$(k).value=S[k];$('o_'+k).textContent=(+S[k]).toFixed(2)});apply()}

function shifter(ctx,rf){const N=16384,M=N-1,W=2048,buf=new Float32Array(N);let w=0,ph=0;const sp=ctx.createScriptProcessor(2048,1,1);
sp.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0),y=e.outputBuffer.getChannelData(0),r=rf();
for(let i=0;i<x.length;i++){buf[w]=x[i];w=(w+1)&M;ph+=(1-r)/W;ph-=Math.floor(ph);let o=0;
for(let k=0;k<2;k++){const p=(ph+k*.5)%1,rp=(w-(p*W+2)+N)%N,i0=Math.floor(rp),f=rp-i0,s=buf[i0&M]*(1-f)+buf[(i0+1)&M]*f,g=Math.sin(Math.PI*p);o+=s*g*g}y[i]=o}};return sp}
function impulse(ctx,sec){const n=ctx.sampleRate*sec|0,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const t=i/n;lp+=((Math.random()*2-1)-lp)*(.25+.5*(1-t));d[i]=lp*Math.pow(1-t,2.6)*1.8}}return b}

let au=new Audio();au.loop=true;
$('file').onchange=e=>{const f=e.target.files[0];if(f){au.src=URL.createObjectURL(f);msg('Backing loaded — it will be included in the next recording')}};
$('bp').onclick=()=>{if(!A)return msg('Turn the microphone on first');au.paused?au.play().catch(()=>msg('Tap Play again to allow audio')):au.pause()};
function msg(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent==t)$('msg').textContent=''},3000)}


async function startMic(){
 if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
  const e=new Error('Microphone access is unavailable in this page context. Open the file in Chrome or the app WebView with microphone permission enabled.');e.name='SecurityError';throw e;
 }
 micLabel='REQUESTING MICROPHONE…';
 $('audioStatus').textContent='Requesting microphone permission…';
 const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
 let constraints={audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}};
 const deviceId=$('device').value;
 if(deviceId)constraints.audio.deviceId={exact:deviceId};
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(constraints)}
 catch(err){await ctx.close();throw err}
 try{
  await ctx.resume();
  const sink=$('outputDevice').value;
  if(sink&&typeof ctx.setSinkId==='function')await ctx.setSinkId(sink);
 }catch(e){msg('Using Android/system audio output. If needed, choose Bluetooth in Android media controls.')}

 const src=ctx.createMediaStreamSource(stream);
 const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=95;hp.Q.value=.707;
 const inputG=ctx.createGain();inputG.gain.value=+$('inputGain').value;
 src.connect(hp);hp.connect(inputG);

 // Voice Studio: only pitch-shifted signal enters the transformed voice path.
 // Ambient Lab is a separate, explicitly selected natural-mic path.
 const st=()=>S.pitch/12;
 const main=shifter(ctx,()=>Math.pow(2,st()));
 const sub=shifter(ctx,()=>Math.pow(2,st())*.5);
 const har=shifter(ctx,()=>Math.pow(2,(S.pitch+S.hi)/12));
 const subG=ctx.createGain(),harG=ctx.createGain(),shiftBus=ctx.createGain();
 inputG.connect(main);inputG.connect(sub);inputG.connect(har);
 main.connect(shiftBus);sub.connect(subG);subG.connect(shiftBus);har.connect(harG);harG.connect(shiftBus);

 const tone=ctx.createGain(),clean=ctx.createGain(),ring=ctx.createGain(),ringW=ctx.createGain();
 ring.gain.value=0;
 const osc=ctx.createOscillator();osc.start();osc.connect(ring.gain);
 const rd=ctx.createDelay(.1),rfb=ctx.createGain(),rdW=ctx.createGain();
 rd.delayTime.value=.006;rfb.gain.value=.35;
 shiftBus.connect(clean);clean.connect(tone);
 shiftBus.connect(ring);ring.connect(ringW);ringW.connect(tone);
 shiftBus.connect(rd);rd.connect(rfb);rfb.connect(rd);rd.connect(rdW);rdW.connect(tone);

 // Basic tonal cleanup, then split the high band so the de-esser acts only on
 // sharp sibilants. The low-frequency high-pass and gentle compression reduce pops.
 const ls=ctx.createBiquadFilter();ls.type='lowshelf';ls.frequency.value=180;ls.gain.value=-2;
 const pk=ctx.createBiquadFilter();pk.type='peaking';pk.frequency.value=280;pk.Q.value=.8;pk.gain.value=0;
 const splitLow=ctx.createBiquadFilter();splitLow.type='lowpass';splitLow.frequency.value=4800;
 const splitHigh=ctx.createBiquadFilter();splitHigh.type='highpass';splitHigh.frequency.value=4800;
 const sibComp=ctx.createDynamicsCompressor();
 sibComp.threshold.value=-32;sibComp.knee.value=8;sibComp.ratio.value=6;
 sibComp.attack.value=.001;sibComp.release.value=.09;
 const lowMix=ctx.createGain(),highMix=ctx.createGain(),deEssSum=ctx.createGain();
 lowMix.gain.value=1;highMix.gain.value=1;
 tone.connect(ls);ls.connect(pk);pk.connect(splitLow);pk.connect(splitHigh);
 splitLow.connect(lowMix);lowMix.connect(deEssSum);
 splitHigh.connect(sibComp);sibComp.connect(highMix);highMix.connect(deEssSum);

 const comp=ctx.createDynamicsCompressor();
 comp.threshold.value=-24;comp.knee.value=12;comp.ratio.value=3.5;
 comp.attack.value=.008;comp.release.value=.20;
 deEssSum.connect(comp);

 const master=ctx.createGain(),voiceG=ctx.createGain(),ambientG=ctx.createGain();
 const ambientComp=ctx.createDynamicsCompressor();
 ambientComp.threshold.value=-30;ambientComp.knee.value=18;ambientComp.ratio.value=2.5;
 ambientComp.attack.value=.01;ambientComp.release.value=.22;
 voiceG.gain.value=mode==='voice'?1:0;
 ambientG.gain.value=mode==='ambient'?1:0;
 comp.connect(voiceG);voiceG.connect(master);
 inputG.connect(ambientComp);ambientComp.connect(ambientG);ambientG.connect(master);

 // Reverb, echo and width remain part of the transformed voice only.
 const conv=ctx.createConvolver();conv.buffer=impulse(ctx,2.2);
 const rG=ctx.createGain();comp.connect(conv);conv.connect(rG);rG.connect(master);
 const eG=ctx.createGain(),dL=ctx.createDelay(1.5),dR=ctx.createDelay(1.5);
 const f1=ctx.createGain(),f2=ctx.createGain(),em=ctx.createChannelMerger(2);
 const eLP=ctx.createBiquadFilter();eLP.type='lowpass';eLP.frequency.value=3200;
 comp.connect(eLP);eLP.connect(dL);dL.connect(f1);f1.connect(dR);dR.connect(f2);
 f2.connect(dL);dL.connect(em,0,0);dR.connect(em,0,1);em.connect(eG);eG.connect(master);
 const wL=ctx.createDelay(.1),wR=ctx.createDelay(.1),wG=ctx.createGain(),mg=ctx.createChannelMerger(2);
 wL.delayTime.value=.012;wR.delayTime.value=.019;
 comp.connect(wL);comp.connect(wR);wL.connect(mg,0,0);wR.connect(mg,0,1);mg.connect(wG);wG.connect(master);

 const limiter=ctx.createDynamicsCompressor();
 limiter.threshold.value=-6;limiter.knee.value=4;limiter.ratio.value=12;
 limiter.attack.value=.003;limiter.release.value=.14;
 master.connect(limiter);

 // One shared program mix: processed voice + loaded backing track.
 // The recording mix keeps the backing track at its proper program level;
 // the headphone branch gently ducks the backing track while recording.
 const processedBus=ctx.createGain();processedBus.gain.value=.85;
 limiter.connect(processedBus);
 if(trackAttached){
  const oldSrc=au.currentSrc||au.src,oldTime=au.currentTime,oldPaused=au.paused;
  const fresh=new Audio();fresh.loop=true;fresh.src=oldSrc;
  if(oldTime>0)fresh.addEventListener('loadedmetadata',()=>{try{fresh.currentTime=oldTime}catch(e){}},{once:true});
  au=fresh;trackAttached=false;
  trackState={src:oldSrc,time:oldTime,playing:!oldPaused};
 }
 const trackSrc=ctx.createMediaElementSource(au);trackAttached=true;
 const backingRecordG=ctx.createGain(),backingMonitorG=ctx.createGain();
 backingRecordG.gain.value=Math.max(.05,S.bk);
 backingMonitorG.gain.value=Math.max(.05,S.bk*.72);
 trackSrc.connect(backingRecordG);trackSrc.connect(backingMonitorG);
 const recordMix=ctx.createGain(),monitorMix=ctx.createGain();
 processedBus.connect(recordMix);processedBus.connect(monitorMix);
 backingRecordG.connect(recordMix);backingMonitorG.connect(monitorMix);
 const mixComp=ctx.createDynamicsCompressor();
 mixComp.threshold.value=-10;mixComp.knee.value=8;mixComp.ratio.value=2.5;
 mixComp.attack.value=.008;mixComp.release.value=.22;
 recordMix.connect(mixComp);
 const mixBoost=ctx.createGain();mixBoost.gain.value=1.22;
 const mixLimiter=ctx.createDynamicsCompressor();mixLimiter.threshold.value=-1.5;mixLimiter.knee.value=1;mixLimiter.ratio.value=20;mixLimiter.attack.value=.002;mixLimiter.release.value=.12;
 mixComp.connect(mixBoost);mixBoost.connect(mixLimiter);
 const monitorG=ctx.createGain();
 monitorG.gain.value=monitorEnabled?+$('monitorGain').value:0;
 monitorMix.connect(monitorG);monitorG.connect(ctx.destination);
 const an=ctx.createAnalyser();an.fftSize=512;recordMix.connect(an);
 // WAV capture taps the complete program mix, not just the microphone.
 const rc=ctx.createScriptProcessor(4096,2,2),mute=ctx.createGain();mute.gain.value=0;
 mixLimiter.connect(rc);rc.connect(mute);mute.connect(ctx.destination);
 rc.onaudioprocess=e=>{
  for(let c=0;c<e.outputBuffer.numberOfChannels;c++)e.outputBuffer.getChannelData(c).fill(0);
  if(rec){
   const left=e.inputBuffer.getChannelData(0),right=e.inputBuffer.numberOfChannels>1?e.inputBuffer.getChannelData(1):left;
   CL.push(new Float32Array(left));CR.push(new Float32Array(right));
  }
 };
 // This destination is also used by the synchronized video recording.
 const recDest=ctx.createMediaStreamDestination();mixLimiter.connect(recDest);
 A={ctx,stream,an,td:new Uint8Array(512),processedBus,monitorG,monitorMix,recordMix,
    backingRecordG,backingMonitorG,trackSrc,mixComp,mixBoost,mixLimiter,recDest,inputG,
    subG,harG,clean,ringW,rdW,osc,ls,pk,eG,dL,dR,f1,f2,rG,wG,
    voiceG,ambientG,splitLow,splitHigh,sibComp,comp,limiter,rc};
 apply();
 await refreshDevices();
 micLabel='MICROPHONE ON';updateAudioButtons();msg('Microphone ready — backing track and voice share the recording mix');
}
async function setOutputDevice(id){
 if(!A){msg('Choose the output before starting the mic, or start the mic first');return}
 if(!id){msg('Using system-default audio output');return}
 if(typeof A.ctx.setSinkId!=='function'){
  msg('This browser cannot select an output directly. Choose Bluetooth using Android media output controls.');
  return;
 }
 try{await A.ctx.setSinkId(id);msg('Selected headphone output')}
 catch(e){msg('Could not switch output. Choose Bluetooth using Android media output controls.')}
}
async function stopMic(){
 if(!A)return;
 if(rec){toggleRec();await new Promise(r=>setTimeout(r,350));}
 trackState={src:au.currentSrc||au.src,time:au.currentTime,playing:!au.paused};
 au.pause();
 const old=A;A=null;
 old.stream.getTracks().forEach(t=>t.stop());
 try{await old.ctx.close()}catch(e){}
 micLabel='TAP TO START';updateAudioButtons();
}
async function toggle(){
 if(A){await stopMic();return}
 try{await startMic()}catch(e){handleMicError(e);micLabel='TAP TO START'}
}
async function refreshDevices(){
 if(!navigator.mediaDevices?.enumerateDevices)return;
 try{
  const ds=await navigator.mediaDevices.enumerateDevices();
  const inSel=$('device').value,outSel=$('outputDevice').value;
  $('device').innerHTML='<option value="">System default microphone</option>';
  ds.filter(d=>d.kind==='audioinput').forEach((d,i)=>{
   const o=document.createElement('option');o.value=d.deviceId;
   o.textContent=d.label||`Microphone ${i+1}`;$('device').append(o);
  });
  if([...$('device').options].some(o=>o.value===inSel))$('device').value=inSel;
  $('outputDevice').innerHTML='<option value="">System default output</option>';
  ds.filter(d=>d.kind==='audiooutput').forEach((d,i)=>{
   const o=document.createElement('option');o.value=d.deviceId;
   o.textContent=d.label||`Output ${i+1}`;$('outputDevice').append(o);
  });
  if([...$('outputDevice').options].some(o=>o.value===outSel))$('outputDevice').value=outSel;
 }catch(e){}
}
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>refreshDevices());
// Populate any devices the browser exposes immediately; labels may appear only after permission.
refreshDevices();
function apply(){
 if(!A)return;
 const t=A.ctx.currentTime,s=(p,v)=>p.setTargetAtTime(v,t,.05);
 s(A.subG.gain,S.sub*.65);s(A.harG.gain,S.hv);
 s(A.clean.gain,1-S.mech*.8);s(A.ringW.gain,S.mech*1.2);
 s(A.rdW.gain,S.mech*.5);s(A.osc.frequency,S.rf);
 s(A.ls.gain,-2+S.body*2);s(A.pk.gain,S.body*2.5);
 s(A.eG.gain,S.echo);s(A.dL.delayTime,S.et);s(A.dR.delayTime,S.et*1.37);
 s(A.f1.gain,S.fb);s(A.f2.gain,S.fb);
 s(A.rG.gain,S.rev);s(A.wG.gain,S.wid*.35);
 if(A.backingRecordG)s(A.backingRecordG.gain,Math.max(.05,S.bk));
 if(A.backingMonitorG)s(A.backingMonitorG.gain,Math.max(.05,S.bk*(rec?.58:.72)));
 s(A.monitorG.gain,monitorEnabled?+$('monitorGain').value:0);
}
function wav(L,R,sr){
 const n=L.reduce((a,c)=>a+c.length,0);let peak=0;

  apply();updateAudioButtons();
  msg(A.audioRecorder?'Recording the mixed voice + song track'+(A.videoRecorder?' and video':'; video unavailable'):'Recording started; WAV backup is active'+(A.videoRecorder?' with video':''));
 }else{
  rec=false;$('t').textContent='';
  const ar=A?.audioRecorder,vr=A?.videoRecorder;
  if(CL.length){
   const b=wav(CL,CR,A.ctx.sampleRate),n=`${recordMode}-mix-${new Date().toISOString().replace(/[:.]/g,'-')}.wav`;

   try{ar.stop()}catch(e){msg('Could not finalize the audio recording')}

   try{vr.stop()}catch(e){msg('Could not finalize the video recording')}
  }else if(!vr)msg('Video was not available; the audio file is handled separately');

 }
}
